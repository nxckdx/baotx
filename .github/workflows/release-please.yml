name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: google-github-actions/release-please-action@v4
        id: release

      - name: Sync baotx script version and upload release asset
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.release.outputs.tag_name }}"
          # release-please already bumped ./VERSION as part of the release PR,
          # so read the plain semver from there instead of parsing the tag string.
          VERSION="$(cat VERSION)"

          echo "Syncing baotx script to version $VERSION (tag $TAG_NAME)..."

          sed -i "s/^VERSION=.*/VERSION=\"$VERSION\"/" baotx

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baotx
          git commit -m "chore: sync baotx script version to $VERSION [skip ci]"
          git push origin main

          gh release upload "$TAG_NAME" baotx --clobber
